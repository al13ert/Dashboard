<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>VINO Personal Training - 5-Screen Command Center</title>
    <!-- HLS.js Library for Broadcast Live Streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --vino-red: #8a0625;
            --vino-dark: #0a0a0c;
            --vino-card: #141418;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--vino-dark);
            color: #ffffff;
        }

        /* DASHBOARD GRID CONTAINER (1920x1080) */
        .dashboard {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-columns: 100vw;
            grid-template-rows: 75px calc(100vh - 120px) 45px;
            background-color: #000;
        }

        /* TIER 1: HEADER BANNER WITH BRANDING & WIDGETS */
        .header-bar {
            grid-row: 1;
            background: linear-gradient(180deg, #181820 0%, #0d0d12 100%);
            border-bottom: 3px solid var(--vino-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 52px;
            max-width: 220px;
            object-fit: contain;
            display: block;
        }

        .logo-text-fallback {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            font-style: italic;
        }

        .logo-text-fallback span {
            color: var(--vino-red);
        }

        .header-widgets {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .widget-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 15px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #weather-box { color: #4da6ff; }
        #date-box { color: #e0e0e0; }

        #clock-box {
            background: var(--vino-red);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            letter-spacing: 1px;
            border: none;
        }

        /* TIER 2: MAIN 5-SCREEN BODY */
        .main-display-body {
            grid-row: 2;
            display: grid;
            grid-template-rows: 60% 40%;
            width: 100%;
            height: 100%;
            gap: 8px;
            padding: 8px;
            background-color: #000;
        }

        /* TOP HALF: 2 BIG SCREENS */
        .top-row-grid {
            display: grid;
            grid-template-columns: 50% 50%;
            width: 100%;
            height: 100%;
            gap: 8px;
        }

        /* BOTTOM HALF: 3 SMALLER SCREENS */
        .bottom-row-grid {
            display: grid;
            grid-template-columns: calc(33.33% - 5.33px) calc(33.33% - 5.33px) calc(33.34% - 5.33px);
            width: 100%;
            height: 100%;
            gap: 8px;
        }

        /* VIDEO CONTAINER BOXES WITH VINO RED BORDER FRAME */
        .video-box {
            position: relative;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--vino-red); /* VINO RED FRAME */
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(138, 6, 37, 0.3); /* SUBTLE RED GLOW */
        }

        .video-box video, .video-box iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
            background: #000;
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(10, 10, 12, 0.9);
            color: #ffffff;
            padding: 4px 10px;
            border-left: 4px solid var(--vino-red);
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 3px;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* TIER 3: ANNOUNCEMENT TICKER FOOTER */
        .ticker-zone {
            grid-row: 3;
            background: #0d0d12;
            border-top: 2px solid var(--vino-red);
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-label {
            background: var(--vino-red);
            color: #fff;
            padding: 0 25px;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 10;
        }

        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 30s linear infinite;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- TIER 1: HEADER BANNER WITH LOGO, DATE, WEATHER & CLOCK -->
        <div class="header-bar">
            
            <div class="logo-container">
                <!-- VINO LOGO IMAGE -->
                <img src="vino_logo.png" alt="VINO Personal Training" class="logo-img" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
                
                <!-- FALLBACK TEXT LOGO IF IMAGE FILE IS MISSING -->
                <div id="fallback-logo" class="logo-text-fallback" style="display:none;">V<span>I</span>NO</div>
            </div>

            <div class="header-widgets">
                <div class="widget-item" id="date-box">
                    <span>📅</span>
                    <span id="live-date">---, -- ---</span>
                </div>
                <div class="widget-item" id="weather-box">
                    <span id="weather-icon">☀️</span>
                    <span id="weather-temp">--°C</span>
                    <span style="font-size: 0.8rem; color:#888;">HK</span>
                </div>
                <div class="widget-item" id="clock-box">00:00:00</div>
            </div>

        </div>

        <!-- TIER 2: MAIN 5-SCREEN BODY WITH RED FRAMES -->
        <div class="main-display-body">
            
            <!-- TOP HALF: 2 BIG SCREENS -->
            <div class="top-row-grid">
                
                <!-- BIG SCREEN 1: WORLD NEWS BROADCAST -->
                <div class="video-box">
                    <div class="video-label">World News (Sky UK)</div>
                    <video id="stream-world" autoplay muted playsinline></video>
                </div>

                <!-- BIG SCREEN 2: VINO MOTIVATION REEL -->
                <div class="video-box">
                    <div class="video-label" style="border-left-color: #ffffff;">VINO Motivation & Athletic Performance</div>
                    <video id="stream-motivation" autoplay loop muted playsinline 
                           src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
                </div>

            </div>

            <!-- BOTTOM HALF: 3 SMALLER SCREENS -->
            <div class="bottom-row-grid">
                
                <!-- SMALL SCREEN 1: HOY TV -->
                <div class="video-box">
                    <div class="video-label">HOY TV Live</div>
                    <video id="stream-hoy" autoplay muted playsinline></video>
                </div>

                <!-- SMALL SCREEN 2: VIUTV / LOCAL BROADCAST -->
                <div class="video-box">
                    <div class="video-label">ViuTV Live Feed</div>
                    <iframe id="iframe-viu" src="https://www.youtube.com/embed/live_stream?channel=UCvIIn1wupM4I-zL3U3N2zGg&autoplay=1&mute=1&controls=0" allow="autoplay; encrypted-media"></iframe>
                </div>

                <!-- SMALL SCREEN 3: RTHK TV 32 -->
                <div class="video-box">
                    <div class="video-label">RTHK 32 • HK Sports & News</div>
                    <video id="stream-rthk" autoplay muted playsinline></video>
                </div>

            </div>

        </div>

        <!-- TIER 3: TICKER FOOTER -->
        <div class="ticker-zone">
            <div class="ticker-label">VINO LIVE</div>
            <div class="ticker-text">
                🔥 WELCOME TO VINO PERSONAL TRAINING • CONSISTENCY DRIVES RESULTS • LIVE LOCAL & WORLD SPORTS BROADCAST • HYDRATE & EXECUTE 🔥
            </div>
        </div>

    </div>

    <script>
        // 1. LIVE CLOCK AND DATE UPDATER
        function updateClockAndDate() {
            var now = new Date();
            document.getElementById('clock-box').innerText = now.toLocaleTimeString();
            var options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            document.getElementById('live-date').innerText = now.toLocaleDateString('en-GB', options);
        }
        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();

        // 2. LIVE HK OBSERVATORY WEATHER API
        function fetchWeather() {
            fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en')
                .then(response => response.json())
                .then(data => {
                    var temp = data.temperature.data[0].value;
                    document.getElementById('weather-temp').innerText = temp + "°C";
                })
                .catch(err => { console.log("Weather error:", err); });
        }
        fetchWeather();
        setInterval(fetchWeather, 600000);

        // 3. INITIALIZE LIVE BROADCAST HLS STREAMS
        window.addEventListener('DOMContentLoaded', function() {
            var streams = [
                { id: 'stream-world', url: 'https://sky-skynewsuk-samsunguk.amagi.tv/playlist.m3u8' },
                { id: 'stream-hoy', url: 'https://hoytv-live-stream.hoy.tv/ch78/index.m3u8' },
                { id: 'stream-rthk', url: 'https://rthklive2-lh.akamaihd.net/i/rthk32_1@168450/index_2052_av-b.m3u8' }
            ];

            streams.forEach(function(s) {
                var elem = document.getElementById(s.id);
                if (Hls.isSupported()) {
                    var hls = new Hls();
                    hls.loadSource(s.url);
                    hls.attachMedia(elem);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        elem.muted = true;
                        elem.play().catch(function(e) { console.log("Autoplay block on " + s.id, e); });
                    });
                } else if (elem.canPlayType('application/vnd.apple.mpegurl')) {
                    elem.src = s.url;
                    elem.muted = true;
                    elem.play();
                }
            });
        });
    </script>

</body>
</html>
