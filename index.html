<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>VINO Personal Training - Command Center</title>
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --vino-red: #8a0625;
            --vino-dark: #0a0a0c;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--vino-dark);
            color: #ffffff;
        }

        /* 1080P DASHBOARD CONTAINER */
        .dashboard {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-rows: 65% 35%;
            padding: 8px;
            gap: 8px;
            background-color: #000000;
        }

        /* TOP ZONE: TWO NATIVE 16:9 TV SCREENS */
        .top-zone {
            display: grid;
            grid-template-columns: calc(50% - 4px) calc(50% - 4px);
            gap: 8px;
            width: 100%;
            height: 100%;
        }

        .tv-box {
            position: relative;
            background-color: #000;
            border: 2px solid var(--vino-red);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tv-box video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* NATIVE UNSTRETCHED BROADCAST */
            background: #000;
        }

        .tv-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(10, 10, 12, 0.9);
            color: #ffffff;
            padding: 4px 10px;
            border-left: 4px solid var(--vino-red);
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 3px;
            z-index: 5;
        }

        /* BOTTOM ZONE: 3 HORIZONTAL DASHBOARD CARDS */
        .bottom-zone {
            display: grid;
            grid-template-columns: 35% 30% 35%;
            gap: 8px;
            width: 100%;
            height: 100%;
        }

        /* CARD 1: PROMO IMAGE */
        .promo-card {
            position: relative;
            background: #000;
            border: 2px solid var(--vino-red);
            border-radius: 6px;
            overflow: hidden;
        }

        .promo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* CARD 2: BRANDING, WEATHER & MARKETS */
        .info-card {
            background: #0e0e12;
            border: 2px solid var(--vino-red);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .brand-box {
            background: #ffffff;
            border-radius: 4px;
            padding: 6px;
            text-align: center;
        }

        .brand-fallback {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #000000;
            font-style: italic;
        }

        .brand-fallback span { color: var(--vino-red); }

        .brand-sub {
            font-size: 0.55rem;
            font-weight: 800;
            color: #333;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: -3px;
        }

        .widget-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 700;
            background: #181820;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #2a2a35;
        }

        #clock-display {
            background: var(--vino-red);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 3px;
        }

        .market-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .market-item {
            background: #181820;
            border: 1px solid #2a2a35;
            padding: 4px 6px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }

        .market-name { font-size: 0.6rem; color: #aaa; font-weight: 700; }
        .market-val { font-size: 0.75rem; font-weight: 800; color: #fff; }
        .market-change { font-size: 0.6rem; font-weight: 700; }
        .up { color: #00e676; }
        .down { color: #ff5252; }

        /* CARD 3: SPORTS RSS PUSH */
        .rss-card {
            background: #0e0e12;
            border: 2px solid var(--vino-red);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .rss-header {
            background: var(--vino-red);
            color: #fff;
            padding: 6px 10px;
            font-weight: 900;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .rss-feed-list {
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow-y: hidden;
            flex: 1;
        }

        .rss-item {
            background: #181820;
            border-left: 3px solid #ffab00;
            padding: 5px 8px;
            border-radius: 3px;
        }

        .rss-item-title {
            font-size: 0.72rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .rss-item-snippet {
            font-size: 0.62rem;
            color: #bbb;
            line-height: 1.15;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- TOP ZONE: 2 LIVE UNSTRETCHED TV STATIONS -->
        <div class="top-zone">
            <div class="tv-box">
                <div class="tv-label">RTHK 32 • HK Live</div>
                <video id="tv-1" autoplay muted playsinline></video>
            </div>

            <div class="tv-box">
                <div class="tv-label">DW World News</div>
                <video id="tv-2" autoplay muted playsinline></video>
            </div>
        </div>

        <!-- BOTTOM ZONE: 3 HORIZONTAL CARDS -->
        <div class="bottom-zone">
            
            <!-- CARD 1: PROMO POSTER -->
            <div class="promo-card">
                <div class="tv-label" style="border-left-color: #ffab00;">VINO Bar Feature</div>
                <img src="promo.jpg" alt="VINO Coffee Protein Shake" onerror="this.src='https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=800&q=80';">
            </div>

            <!-- CARD 2: BRANDING & MARKETS -->
            <div class="info-card">
                <div class="brand-box">
                    <img src="vino_logo.png" alt="VINO" style="max-height: 32px; object-fit: contain;" onerror="this.style.display='none'; document.getElementById('brand-fallback').style.display='block';">
                    <div id="brand-fallback" class="brand-fallback" style="display:none;">
                        V<span>I</span>NO
                        <div class="brand-sub">Personal Training</div>
                    </div>
                </div>

                <div class="widget-row">
                    <span id="clock-display">00:00:00</span>
                    <span>☀ <span id="weather-temp">--°C</span> HK</span>
                </div>

                <div class="market-grid">
                    <div class="market-item">
                        <span class="market-name">HSI (HK)</span>
                        <span class="market-val" id="hsi-val">21,120</span>
                        <span class="market-change up" id="hsi-chg">+1.24%</span>
                    </div>
                    <div class="market-item">
                        <span class="market-name">DOW JONES</span>
                        <span class="market-val" id="dow-val">42,150</span>
                        <span class="market-change up" id="dow-chg">+0.45%</span>
                    </div>
                    <div class="market-item">
                        <span class="market-name">S&P 500</span>
                        <span class="market-val" id="sp-val">5,740</span>
                        <span class="market-change up" id="sp-chg">+0.38%</span>
                    </div>
                    <div class="market-item">
                        <span class="market-name">NASDAQ</span>
                        <span class="market-val" id="nas-val">18,100</span>
                        <span class="market-change down" id="nas-chg">-0.15%</span>
                    </div>
                </div>
            </div>

            <!-- CARD 3: WORLD SPORTS RSS -->
            <div class="rss-card">
                <div class="rss-header">🏆 World Sports News Push</div>
                <div class="rss-feed-list" id="rss-container">
                    <div style="color: #888; font-size: 0.7rem; text-align: center; margin-top: 10px;">Loading headlines...</div>
                </div>
            </div>

        </div>

    </div>

    <script>
        function updateClock() {
            var now = new Date();
            document.getElementById('clock-display').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        function fetchWeather() {
            fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en')
                .then(r => r.json())
                .then(d => { document.getElementById('weather-temp').innerText = d.temperature.data[0].value + "°C"; })
                .catch(e => console.log(e));
        }
        fetchWeather();

        function fetchMarketData() {
            fetch('https://query1.finance.yahoo.com/v7/finance/quote?symbols=^HSI,^DJI,^GSPC,^IXIC')
                .then(r => r.json())
                .then(data => {
                    if (data.quoteResponse && data.quoteResponse.result) {
                        data.quoteResponse.result.forEach(q => {
                            var p = q.regularMarketPrice ? q.regularMarketPrice.toLocaleString(undefined, {maximumFractionDigits:0}) : '--';
                            var c = q.regularMarketChangePercent ? q.regularMarketChangePercent.toFixed(2) + '%' : '0.00%';
                            var isUp = q.regularMarketChangePercent >= 0;
                            var cls = isUp ? 'market-change up' : 'market-change down';
                            var pre = isUp ? '+' : '';

                            if (q.symbol === '^HSI') { document.getElementById('hsi-val').innerText = p; document.getElementById('hsi-chg').innerText = pre + c; document.getElementById('hsi-chg').className = cls; }
                            else if (q.symbol === '^DJI') { document.getElementById('dow-val').innerText = p; document.getElementById('dow-chg').innerText = pre + c; document.getElementById('dow-chg').className = cls; }
                            else if (q.symbol === '^GSPC') { document.getElementById('sp-val').innerText = p; document.getElementById('sp-chg').innerText = pre + c; document.getElementById('sp-chg').className = cls; }
                            else if (q.symbol === '^IXIC') { document.getElementById('nas-val').innerText = p; document.getElementById('nas-chg').innerText = pre + c; document.getElementById('nas-chg').className = cls; }
                        });
                    }
                }).catch(e => console.log(e));
        }
        fetchMarketData();

        function fetchSportsRSS() {
            var apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('http://feeds.bbci.co.uk/sport/rss.xml');
            fetch(apiUrl)
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'ok' && data.items.length > 0) {
                        var container = document.getElementById('rss-container');
                        container.innerHTML = '';
                        data.items.slice(0, 3).forEach(item => {
                            var div = document.createElement('div');
                            div.className = 'rss-item';
                            var desc = item.description ? item.description.replace(/<[^>]*>?/gm, '') : '';
                            div.innerHTML = '<div class="rss-item-title">' + item.title + '</div><div class="rss-item-snippet">' + desc + '</div>';
                            container.appendChild(div);
                        });
                    }
                }).catch(e => console.log(e));
        }
        fetchSportsRSS();

        function loadStream(id, url) {
            var elem = document.getElementById(id);
            if (Hls.isSupported()) {
                var hls = new Hls({ manifestLoadingTimeOut: 10000 });
                hls.loadSource(url);
                hls.attachMedia(elem);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { elem.muted = true; elem.play(); });
            } else if (elem.canPlayType('application/vnd.apple.mpegurl')) {
                elem.src = url; elem.muted = true; elem.play();
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            loadStream('tv-1', 'https://rthklive2-lh.akamaihd.net/i/rthk32_1@168450/index_1080_av-b.m3u8');
            loadStream('tv-2', 'https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8');
        });
    </script>

</body>
</html>
