<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Digital Signage - 2x2 TV Grid & Calendar</title>
    <!-- HLS.js Library for Decoding Multiple Broadcast Streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            color: #ffffff;
        }

        /* 3-TIER VERTICAL DASHBOARD GRID (1080x1920) */
        .dashboard {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-columns: 100vw;
            grid-template-rows: 6% 88% 6%;
            background-color: #000;
        }

        /* TIER 1: HEADER BAR (CLOCK & WEATHER) */
        .header-bar {
            grid-row: 1;
            background: #111115;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 30px;
        }

        .widget-zone {
            display: flex;
            align-items: center;
            gap: 25px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        #weather-box {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4da6ff;
        }

        #clock-box {
            background: #1a1a24;
            padding: 6px 16px;
            border-radius: 6px;
            color: #fff;
            border: 1px solid #333;
        }

        /* TIER 2: MAIN ZONE (70% 2x2 QUADRANT GRID | 30% CALENDAR) */
        .split-main-zone {
            grid-row: 2;
            display: grid;
            grid-template-columns: 70% 30%;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        /* LEFT SIDE: 2x2 QUADRANT */
        .video-quadrant-grid {
            grid-column: 1;
            display: grid;
            grid-template-columns: 50% 50%;
            grid-template-rows: 50% 50%;
            width: 100%;
            height: 100%;
            border-right: 2px solid #222;
        }

        .video-box {
            position: relative;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #1a1a24;
            padding: 6px;
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            border-radius: 4px;
        }

        .video-label {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 4px 10px;
            border-left: 3px solid #4da6ff;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 3px;
            z-index: 5;
        }

        .tag-uk { border-left-color: #0055bf; }
        .tag-finance { border-left-color: #00c853; }
        .tag-local-news { border-left-color: #e50914; }
        .tag-local-tv { border-left-color: #ff9100; }

        /* RIGHT SIDE: FULL HEIGHT CALENDAR */
        .calendar-column {
            grid-column: 2;
            width: 100%;
            height: 100%;
            background: #ffffff;
        }

        .calendar-column iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* TIER 3: ANNOUNCEMENTS TICKER FOOTER */
        .ticker-zone {
            grid-row: 3;
            background: #111115;
            border-top: 2px solid #333;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-label {
            background: #222;
            color: #fff;
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 10;
        }

        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 25s linear infinite;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- TIER 1: HEADER BAR -->
        <div class="header-bar">
            <div class="widget-zone">
                <div id="weather-box">
                    <span id="weather-icon">☀️</span>
                    <span id="weather-temp">24°C</span>
                    <span style="font-size: 0.9rem; color:#888;">HK</span>
                </div>
                <div id="clock-box">00:00:00</div>
            </div>
        </div>

        <!-- TIER 2: MAIN ZONE (2x2 QUADRANT + CALENDAR) -->
        <div class="split-main-zone">
            
            <div class="video-quadrant-grid">
                
                <!-- TOP LEFT: UK NEWS (SKY NEWS UK) -->
                <div class="video-box">
                    <div class="video-label tag-uk">UK News (Sky News)</div>
                    <video id="tv-intl" autoplay muted playsinline></video>
                </div>

                <!-- TOP RIGHT: FINANCE / WORLD NEWS (DW) -->
                <div class="video-box">
                    <div class="video-label tag-finance">Finance / World (DW)</div>
                    <video id="tv-finance" autoplay muted playsinline></video>
                </div>

                <!-- BOTTOM LEFT: LOCAL HK NEWS (RTHK 32) -->
                <div class="video-box">
                    <div class="video-label tag-local-news">HK News (RTHK 32)</div>
                    <video id="tv-local-news" autoplay muted playsinline></video>
                </div>

                <!-- BOTTOM RIGHT: LOCAL HK TV (RTHK 31) -->
                <div class="video-box">
                    <div class="video-label tag-local-tv">RTHK TV 31</div>
                    <video id="tv-local-gen" autoplay muted playsinline></video>
                </div>

            </div>

            <!-- RIGHT PANEL: GOOGLE CALENDAR -->
            <div class="calendar-column">
                <iframe 
                    src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Asia%2FHong_Kong&showPrint=0&showTitle=0&showNav=0&showDate=1&showTabs=0&showCalendars=0&mode=AGENDA&src=YWxiZXJ0QHBvaW50b2ZhYy5jb20&src=Z2lubmllQHBvaW50b2ZhYy5jb20&src=dmlhbkBwb2ludG9mYWMuY29t&src=ZW4uaG9uZ19rb25nI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&color=%23039be5&color=%238e24aa&color=%23a79b8e&color=%230b8043" 
                    title="Live Schedule Calendar">
                </iframe>
            </div>

        </div>

        <!-- TIER 3: ANNOUNCEMENTS TICKER FOOTER -->
        <div class="ticker-zone">
            <div class="ticker-label">LATEST NEWS</div>
            <div class="ticker-text">
                🚨 Multi-Stream Quad Dashboard • Top Left: UK News (Sky News) | Top Right: World & Finance | Bottom: HK Local Broadcasts 🚨
            </div>
        </div>

    </div>

    <script>
        // 1. LIVE DIGITAL CLOCK
        function updateClock() {
            var now = new Date();
            document.getElementById('clock-box').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. LIVE WEATHER (HK OBSERVATORY)
        function fetchWeather() {
            fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en')
                .then(response => response.json())
                .then(data => {
                    var temp = data.temperature.data[0].value;
                    document.getElementById('weather-temp').innerText = temp + "°C";
                })
                .catch(err => { console.log("Weather error:", err); });
        }
        fetchWeather();
        setInterval(fetchWeather, 600000);

        // 3. INITIALIZE ALL 4 QUADRANT STREAMS
        window.addEventListener('DOMContentLoaded', function() {
            
            var streams = [
                { id: 'tv-intl', url: 'https://sky-skynewsuk-samsunguk.amagi.tv/playlist.m3u8' },                     // 1. Sky News UK Live Feed
                { id: 'tv-finance', url: 'https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8' }, // 2. DW World / Finance
                { id: 'tv-local-news', url: 'https://rthklive2-lh.akamaihd.net/i/rthk32_1@168450/index_2052_av-b.m3u8' }, // 3. RTHK TV 32 (HK News)
                { id: 'tv-local-gen', url: 'https://rthklive1-lh.akamaihd.net/i/rthk31_1@167495/index_2052_av-p.m3u8' }   // 4. RTHK TV 31 (HK TV)
            ];

            streams.forEach(function(s) {
                var elem = document.getElementById(s.id);
                if (Hls.isSupported()) {
                    var hls = new Hls();
                    hls.loadSource(s.url);
                    hls.attachMedia(elem);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        elem.muted = true;
                        elem.play().catch(function(e) { console.log("Autoplay block on " + s.id, e); });
                    });
                } else if (elem.canPlayType('application/vnd.apple.mpegurl')) {
                    elem.src = s.url;
                    elem.muted = true;
                    elem.play();
                }
            });

        });
    </script>

</body>
</html>
