<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINO Personal Training - Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif !important;
        }
        :root {
            --vino-red: #8a0625;
            --vino-dark: #0a0a0c;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #ffffff;
            overflow: hidden;
        }
        .dashboard {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-rows: 42px 1fr 1fr 36px;
            gap: 6px;
            padding: 6px;
            background-color: #000;
        }

        /* ===== TOP BANNER (WHITE) ===== */
        .top-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border-radius: 4px;
            padding: 0 14px;
            font-weight: 900;
            letter-spacing: 1px;
            border: 2px solid var(--vino-red);
        }
        .brand {
            font-size: 1.15rem;
            font-style: italic;
            letter-spacing: 2px;
            color: #000;
        }
        .brand span { color: var(--vino-red); }
        .banner-right {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 0.9rem;
            color: #111;
            font-weight: 700;
        }
        #clock-display {
            background: var(--vino-red);
            color: #fff;
            padding: 3px 10px;
            border-radius: 3px;
            font-weight: 900;
        }
        #weather-display {
            font-weight: 700;
            color: #222;
        }

        /* ===== MAIN VIDEO ZONES ===== */
        .video-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            min-height: 0;
        }
        .tv-box {
            position: relative;
            background: #000;
            border: 2px solid var(--vino-red);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tv-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .stream-label {
            position: absolute;
            top: 7px;
            left: 7px;
            background: rgba(138, 6, 37, 0.92);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 3px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 2;
            pointer-events: none;
        }

        /* ===== BOTTOM STOCK TICKER ===== */
        .ticker-bar {
            background: #111;
            border: 1px solid var(--vino-red);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            position: relative;
        }
        .ticker-label {
            background: var(--vino-red);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 0 12px;
            height: 100%;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
            flex-shrink: 0;
            z-index: 2;
        }
        .ticker-track {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
        }
        .ticker-content {
            display: inline-block;
            padding-left: 100%;
            animation: ticker-scroll 32s linear infinite;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .ticker-content span {
            margin-right: 48px;
        }
        .ticker-content .up { color: #00e676; }
        .ticker-content .down { color: #ff5252; }
        .ticker-content .name { color: #aaa; margin-right: 6px; }
        @keyframes ticker-scroll {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div class="dashboard">

        <!-- TOP BANNER (WHITE) -->
        <div class="top-banner">
            <div class="brand">V<span>I</span>NO Personal Training</div>
            <div class="banner-right">
                <span id="weather-display">☀ --°C  Hong Kong</span>
                <span id="clock-display">00:00:00</span>
            </div>
        </div>

        <!-- TOP VIDEOS: Red Bull + FIFA -->
        <div class="video-zone">
            <div class="tv-box">
                <span class="stream-label">Red Bull TV</span>
                <video id="tv-1" autoplay muted playsinline></video>
            </div>
            <div class="tv-box">
                <span class="stream-label">FIFA+</span>
                <video id="tv-2" autoplay muted playsinline></video>
            </div>
        </div>

        <!-- BOTTOM VIDEOS: RTHK + DW -->
        <div class="video-zone">
            <div class="tv-box">
                <span class="stream-label">RTHK 32</span>
                <video id="tv-3" autoplay muted playsinline></video>
            </div>
            <div class="tv-box">
                <span class="stream-label">DW English</span>
                <video id="tv-4" autoplay muted playsinline></video>
            </div>
        </div>

        <!-- STOCK TICKER -->
        <div class="ticker-bar">
            <div class="ticker-label">MARKETS</div>
            <div class="ticker-track">
                <div class="ticker-content" id="ticker-content">
                    <span><span class="name">HSI</span> <span id="hsi-val">--</span> <span id="hsi-chg" class="up">--</span></span>
                    <span><span class="name">DOW</span> <span id="dow-val">--</span> <span id="dow-chg" class="up">--</span></span>
                    <span><span class="name">S&P 500</span> <span id="sp-val">--</span> <span id="sp-chg" class="up">--</span></span>
                    <span><span class="name">NASDAQ</span> <span id="nas-val">--</span> <span id="nas-chg" class="down">--</span></span>
                    <!-- duplicated for seamless loop -->
                    <span><span class="name">HSI</span> <span id="hsi-val2">--</span> <span id="hsi-chg2" class="up">--</span></span>
                    <span><span class="name">DOW</span> <span id="dow-val2">--</span> <span id="dow-chg2" class="up">--</span></span>
                    <span><span class="name">S&P 500</span> <span id="sp-val2">--</span> <span id="sp-chg2" class="up">--</span></span>
                    <span><span class="name">NASDAQ</span> <span id="nas-val2">--</span> <span id="nas-chg2" class="down">--</span></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== CLOCK =====
        function updateClock() {
            document.getElementById('clock-display').innerText =
                new Date().toLocaleTimeString('en-HK', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ===== WEATHER =====
        function fetchWeather() {
            fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en')
                .then(r => r.json())
                .then(d => {
                    if (d.temperature && d.temperature.data && d.temperature.data[0]) {
                        document.getElementById('weather-display').innerText =
                            '☀ ' + d.temperature.data[0].value + '°C  Hong Kong';
                    }
                })
                .catch(() => {});
        }
        fetchWeather();

        // ===== MARKETS → TICKER =====
        function updateTickerItem(prefix, price, changePercent) {
            const p = (price !== undefined && price !== null)
                ? Number(price).toLocaleString(undefined, { maximumFractionDigits: 0 })
                : '--';
            const chg = changePercent;
            const c = (chg !== undefined && chg !== null) ? Number(chg).toFixed(2) + '%' : '--';
            const isUp = Number(chg) >= 0;
            const cls = isUp ? 'up' : 'down';
            const pre = isUp ? '+' : '';

            ['', '2'].forEach(suffix => {
                const valEl = document.getElementById(prefix + '-val' + suffix);
                const chgEl = document.getElementById(prefix + '-chg' + suffix);
                if (valEl) valEl.innerText = p;
                if (chgEl) {
                    chgEl.innerText = pre + c;
                    chgEl.className = cls;
                }
            });
        }

        async function fetchMarketData() {
            // Try multiple approaches because Yahoo blocks most browser CORS requests
            const symbols = '^HSI,^DJI,^GSPC,^IXIC';
            const yahooUrl = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=' + symbols;

            // 1) Direct (rarely works from browser)
            try {
                const r = await fetch(yahooUrl);
                if (r.ok) {
                    const data = await r.json();
                    if (data.quoteResponse && data.quoteResponse.result) {
                        applyQuotes(data.quoteResponse.result);
                        return;
                    }
                }
            } catch (e) {}

            // 2) CORS proxy fallback
            try {
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(yahooUrl);
                const r = await fetch(proxyUrl);
                if (r.ok) {
                    const data = await r.json();
                    if (data.quoteResponse && data.quoteResponse.result) {
                        applyQuotes(data.quoteResponse.result);
                        return;
                    }
                }
            } catch (e) {}

            // 3) Another proxy
            try {
                const proxyUrl2 = 'https://corsproxy.io/?' + encodeURIComponent(yahooUrl);
                const r = await fetch(proxyUrl2);
                if (r.ok) {
                    const data = await r.json();
                    if (data.quoteResponse && data.quoteResponse.result) {
                        applyQuotes(data.quoteResponse.result);
                        return;
                    }
                }
            } catch (e) {}

            console.warn('Market data unavailable (CORS / network)');
        }

        function applyQuotes(results) {
            results.forEach(q => {
                if (q.symbol === '^HSI')  updateTickerItem('hsi', q.regularMarketPrice, q.regularMarketChangePercent);
                if (q.symbol === '^DJI')  updateTickerItem('dow', q.regularMarketPrice, q.regularMarketChangePercent);
                if (q.symbol === '^GSPC') updateTickerItem('sp',  q.regularMarketPrice, q.regularMarketChangePercent);
                if (q.symbol === '^IXIC') updateTickerItem('nas', q.regularMarketPrice, q.regularMarketChangePercent);
            });
        }

        fetchMarketData();
        setInterval(fetchMarketData, 60000);

        // ===== HLS LOADER =====
        function loadStream(id, url) {
            const elem = document.getElementById(id);
            if (!elem) return;

            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    manifestLoadingTimeOut: 15000,
                    levelLoadingTimeOut: 15000
                });
                hls.loadSource(url);
                hls.attachMedia(elem);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    elem.muted = true;
                    elem.play().catch(() => {});
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) console.warn('Stream error on', id, data.type);
                });
            } else if (elem.canPlayType('application/vnd.apple.mpegurl')) {
                elem.src = url;
                elem.muted = true;
                elem.play().catch(() => {});
            }
        }

        // ===== LOAD STREAMS =====
        window.addEventListener('DOMContentLoaded', () => {
            // Top row
            loadStream('tv-1', 'https://e7c8f7d5.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWdiX1JlZEJ1bGxUVi0xX0hMUw/playlist.m3u8'); // Red Bull TV
            loadStream('tv-2', 'https://a62dad94.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWV1X0ZJRkFQbHVzRW5nbGlzaF9ITFM/playlist.m3u8'); // FIFA+

            // Bottom row
            loadStream('tv-3', 'https://rthktv32-live.akamaized.net/hls/live/2036819/RTHKTV32/master.m3u8'); // RTHK 32
            loadStream('tv-4', 'https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/master.m3u8'); // DW English
        });
    </script>
</body>
</html>
