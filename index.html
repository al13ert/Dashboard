<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>VINO Personal Training - Dashboard</title>
    <!-- HLS.js Library for Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --vino-red: #8a0625;
            --vino-dark: #0a0a0c;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--vino-dark);
            color: #ffffff;
        }

        /* 2-COLUMN MAIN LAYOUT (LEFT CONTENT 75% / RIGHT SIDEBAR 25%) */
        .layout-container {
            display: grid;
            grid-template-columns: 75% 25%;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
        }

        /* LEFT CONTENT AREA: TOP 3 TV CHANNELS + BOTTOM BIG PROMO */
        .left-content {
            display: grid;
            grid-template-rows: 45% 55%;
            height: 100vh;
            padding: 8px;
            gap: 8px;
        }

        /* TOP ROW: 3 SIDE-BY-SIDE LIVE TV CHANNELS */
        .tv-channels-row {
            display: grid;
            grid-template-columns: calc(33.33% - 5.33px) calc(33.33% - 5.33px) calc(33.34% - 5.33px);
            gap: 8px;
            width: 100%;
            height: 100%;
        }

        /* BOTTOM ROW: BIG PROMO PROTEIN SHAKE DISPLAY */
        .promo-big-row {
            width: 100%;
            height: 100%;
        }

        .media-box {
            position: relative;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--vino-red);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(138, 6, 37, 0.4);
            width: 100%;
            height: 100%;
        }

        .media-box video, .media-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
            background: #000;
        }

        .media-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(10, 10, 12, 0.9);
            color: #ffffff;
            padding: 4px 10px;
            border-left: 4px solid var(--vino-red);
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 3px;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* RIGHT THICKER SIDEBAR (VINO LOGO, WEATHER, RSS NEWS PUSH) */
        .right-sidebar {
            background: #0e0e12;
            border-left: 4px solid var(--vino-red);
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
            height: 100vh;
        }

        /* VINO LOGO BOX (WHITE BACKGROUND FOR MAX CONTRAST) */
        .sidebar-logo-box {
            background: #ffffff;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 3px solid var(--vino-red);
        }

        .sidebar-logo-img {
            max-height: 65px;
            max-width: 100%;
            object-fit: contain;
        }

        .sidebar-logo-fallback {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #000000;
            font-style: italic;
        }

        .sidebar-logo-fallback span { color: var(--vino-red); }

        /* WEATHER & TIME WIDGET CARD */
        .widget-card {
            background: #181820;
            border: 1px solid #2a2a35;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .widget-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: 700;
        }

        #clock-display {
            background: var(--vino-red);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.4rem;
            font-weight: 900;
            text-align: center;
            padding: 6px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        /* RSS PUSH NEWS PANEL */
        .rss-panel {
            background: #14141a;
            border: 1px solid #282832;
            border-radius: 6px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .rss-header {
            background: var(--vino-red);
            color: #ffffff;
            padding: 8px 12px;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rss-feed-list {
            padding: 10px;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .rss-item {
            background: #1c1c24;
            border-left: 3px solid #ffab00;
            padding: 10px;
            border-radius: 4px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .rss-item-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .rss-item-time {
            font-size: 0.7rem;
            color: #aaaaaa;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="layout-container">

        <!-- LEFT AREA: 3 TV CHANNELS TOP + BIG PROMO BOTTOM -->
        <div class="left-content">
            
            <!-- TOP 3 LIVE TV STATIONS -->
            <div class="tv-channels-row">
                
                <!-- TV 1: RTHK 32 -->
                <div class="media-box">
                    <div class="media-label">RTHK 32 • HK Live</div>
                    <video id="tv-1" autoplay muted playsinline></video>
                </div>

                <!-- TV 2: DW NEWS WORLD -->
                <div class="media-box">
                    <div class="media-label">DW World News</div>
                    <video id="tv-2" autoplay muted playsinline></video>
                </div>

                <!-- TV 3: FRANCE 24 -->
                <div class="media-box">
                    <div class="media-label">France 24 Live</div>
                    <video id="tv-3" autoplay muted playsinline></video>
                </div>

            </div>

            <!-- BOTTOM BIG PROMO FEATURE -->
            <div class="promo-big-row">
                <div class="media-box" style="border-width: 3px;">
                    <div class="media-label" style="border-left-color: #ffab00; font-size: 0.95rem; padding: 6px 14px;">VINO Bar Special</div>
                    <img src="promo.jpg" alt="VINO House-Made Coffee Protein Shake">
                </div>
            </div>

        </div>

        <!-- RIGHT SIDEBAR: LOGO, WEATHER, TIME & RSS NEWS PUSH -->
        <div class="right-sidebar">
            
            <!-- VINO LOGO (WHITE BOX) -->
            <div class="sidebar-logo-box">
                <img src="vino_logo.png" alt="VINO Personal Training" class="sidebar-logo-img" onerror="this.style.display='none'; document.getElementById('sidebar-logo-fallback').style.display='block';">
                <div id="sidebar-logo-fallback" class="sidebar-logo-fallback" style="display:none;">V<span>I</span>NO</div>
            </div>

            <!-- TIME & WEATHER WIDGET -->
            <div class="widget-card">
                <div id="clock-display">00:00:00</div>
                <div class="widget-row" style="color: #dddddd;">
                    <span>📅 <span id="live-date">---, -- ---</span></span>
                </div>
                <div class="widget-row" style="color: #4da6ff;">
                    <span>☀️️ HK Temp</span>
                    <span id="weather-temp" style="font-size: 1.1rem; color: #ffffff;">--°C</span>
                </div>
            </div>

            <!-- LIVE RSS NEWS PUSH FEED -->
            <div class="rss-panel">
                <div class="rss-header">
                    <span>📡</span>
                    <span>HK & World Live News</span>
                </div>
                <div class="rss-feed-list" id="rss-container">
                    <div style="color: #888; font-size: 0.85rem; text-align: center; margin-top: 20px;">Fetching latest news push...</div>
                </div>
            </div>

        </div>

    </div>

    <script>
        // 1. LIVE CLOCK & DATE
        function updateClockAndDate() {
            var now = new Date();
            document.getElementById('clock-display').innerText = now.toLocaleTimeString();
            var options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            document.getElementById('live-date').innerText = now.toLocaleDateString('en-GB', options);
        }
        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();

        // 2. LIVE HK OBSERVATORY WEATHER API
        function fetchWeather() {
            fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en')
                .then(response => response.json())
                .then(data => {
                    var temp = data.temperature.data[0].value;
                    document.getElementById('weather-temp').innerText = temp + "°C";
                })
                .catch(err => { console.log("Weather error:", err); });
        }
        fetchWeather();
        setInterval(fetchWeather, 600000);

        // 3. LIVE RSS NEWS PUSH PULLER (RTHK Express News)
        function fetchRSSNews() {
            var rssUrl = 'https://rthk.hk/rthk/news/rss/e_expressnews_elocal.xml';
            var apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl);

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok' && data.items.length > 0) {
                        var container = document.getElementById('rss-container');
                        container.innerHTML = '';
                        // Display top 5 latest news items
                        data.items.slice(0, 5).forEach(function(item) {
                            var div = document.createElement('div');
                            div.className = 'rss-item';
                            var pubTime = new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                            div.innerHTML = '<div class="rss-item-title">' + item.title + '</div><div class="rss-item-time">🕒 ' + pubTime + '</div>';
                            container.appendChild(div);
                        });
                    }
                })
                .catch(err => { console.log("RSS Fetch error:", err); });
        }
        fetchRSSNews();
        setInterval(fetchRSSNews, 120000); // Refresh news feed every 2 minutes

        // 4. INITIALIZE 3 TV CHANNELS
        function loadStream(id, liveUrl) {
            var elem = document.getElementById(id);
            if (!elem) return;

            if (Hls.isSupported()) {
                var hls = new Hls({
                    manifestLoadingTimeOut: 10000,
                    manifestLoadingMaxRetry: 5
                });
                hls.loadSource(liveUrl);
                hls.attachMedia(elem);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    elem.muted = true;
                    elem.play().catch(function(e) { console.log("Autoplay block on " + id, e); });
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (elem.canPlayType('application/vnd.apple.mpegurl')) {
                elem.src = liveUrl;
                elem.muted = true;
                elem.play();
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            loadStream('tv-1', 'https://rthklive2-lh.akamaihd.net/i/rthk32_1@168450/index_1080_av-b.m3u8');
            loadStream('tv-2', 'https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8');
            loadStream('tv-3', 'https://static.france24.com/live/F24_EN_LO_HLS/live_tv.m3u8');
        });
    </script>

</body>
</html>
