<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINO Personal Training - Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif !important;
        }
        :root {
            --vino-red: #8a0625;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #ffffff;
            overflow: hidden;
        }
        .dashboard {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-rows: 48px 1fr 36px;
            gap: 6px;
            padding: 6px;
            background-color: #000;
        }

        /* ===== TOP BANNER (WHITE) ===== */
        .top-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border-radius: 4px;
            padding: 0 14px;
            font-weight: 900;
            letter-spacing: 1px;
            border: 2px solid var(--vino-red);
        }
        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-wrap img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }
        .brand-text {
            font-size: 1.1rem;
            font-style: italic;
            letter-spacing: 2px;
            color: #000;
        }
        .brand-text span { color: var(--vino-red); }
        .banner-right {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 0.9rem;
            color: #111;
            font-weight: 700;
        }
        #clock-display {
            background: var(--vino-red);
            color: #fff;
            padding: 3px 10px;
            border-radius: 3px;
            font-weight: 900;
        }
        #weather-display {
            font-weight: 700;
            color: #222;
        }

        /* ===== MAIN CONTENT AREA ===== */
        .main-area {
            display: grid;
            grid-template-columns: 1fr 0fr;
            gap: 6px;
            min-height: 0;
            transition: grid-template-columns 1.1s ease;
        }
        .main-area.promo-mode {
            grid-template-columns: 42% 1fr;
        }

        .streams-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            min-height: 0;
        }
        .tv-box {
            position: relative;
            background: #000;
            border: 2px solid var(--vino-red);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tv-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .stream-label {
            position: absolute;
            top: 7px;
            left: 7px;
            background: rgba(138, 6, 37, 0.92);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 3px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 2;
            pointer-events: none;
        }

        .promo-panel {
            position: relative;
            background: #000;
            border: 2px solid var(--vino-red);
            border-radius: 5px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.8s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-area.promo-mode .promo-panel {
            opacity: 1;
        }
        .promo-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .promo-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(138, 6, 37, 0.9);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 3px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ===== BOTTOM HKEX STOCK TICKER ===== */
        .ticker-bar {
            background: #111;
            border: 1px solid var(--vino-red);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            position: relative;
        }
        .ticker-label {
            background: var(--vino-red);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 0 12px;
            height: 100%;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
            flex-shrink: 0;
            z-index: 2;
        }
        .ticker-track {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
        }
        .ticker-content {
            display: inline-block;
            padding-left: 100%;
            animation: ticker-scroll 55s linear infinite;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .ticker-content .item {
            margin-right: 40px;
            display: inline-block;
        }
        .ticker-content .up { color: #00e676; }
        .ticker-content .down { color: #ff5252; }
        .ticker-content .name { color: #ccc; margin-right: 5px; }
        .ticker-content .code { color: #888; font-size: 0.75rem; margin-right: 4px; }
        @keyframes ticker-scroll {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div class="dashboard">

        <!-- TOP BANNER -->
        <div class="top-banner">
            <div class="brand-wrap">
                <img src="vino_logo.png" alt="VINO"
                     onerror="this.style.display='none'; document.getElementById('brand-fallback').style.display='inline';">
                <span id="brand-fallback" class="brand-text" style="display:none;">
                    V<span>I</span>NO Personal Training
                </span>
            </div>
            <div class="banner-right">
                <span id="weather-display">☀ --°C  Hong Kong</span>
                <span id="clock-display">00:00:00</span>
            </div>
        </div>

        <!-- MAIN AREA -->
        <div class="main-area" id="main-area">
            <div class="streams-grid">
                <div class="tv-box">
                    <span class="stream-label">Red Bull TV</span>
                    <video id="tv-1" autoplay muted playsinline></video>
                </div>
                <div class="tv-box">
                    <span class="stream-label">FIFA+</span>
                    <video id="tv-2" autoplay muted playsinline></video>
                </div>
                <div class="tv-box">
                    <span class="stream-label">RTHK 32</span>
                    <video id="tv-3" autoplay muted playsinline></video>
                </div>
                <div class="tv-box">
                    <span class="stream-label">DW English</span>
                    <video id="tv-4" autoplay muted playsinline></video>
                </div>
            </div>

            <div class="promo-panel">
                <img src="promo.jpg" alt="VINO Promo"
                     onerror="this.src='https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=900&q=80';">
                <span class="promo-label">VINO Promo</span>
            </div>
        </div>

        <!-- HKEX STOCK TICKER -->
        <div class="ticker-bar">
            <div class="ticker-label">HKEX</div>
            <div class="ticker-track">
                <div class="ticker-content" id="ticker-content">
                    <!-- filled by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== CLOCK =====
        function updateClock() {
            document.getElementById('clock-display').innerText =
                new Date().toLocaleTimeString('en-HK', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ===== WEATHER =====
        function fetchWeather() {
            fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en')
                .then(r => r.json())
                .then(d => {
                    if (d.temperature && d.temperature.data && d.temperature.data[0]) {
                        document.getElementById('weather-display').innerText =
                            '☀ ' + d.temperature.data[0].value + '°C  Hong Kong';
                    }
                })
                .catch(() => {});
        }
        fetchWeather();

        // ===== HKEX STOCKS =====
        const HK_STOCKS = [
            { symbol: '0700.HK', name: 'Tencent' },
            { symbol: '9988.HK', name: 'Alibaba' },
            { symbol: '0005.HK', name: 'HSBC' },
            { symbol: '1299.HK', name: 'AIA' },
            { symbol: '0941.HK', name: 'China Mobile' },
            { symbol: '2318.HK', name: 'Ping An' },
            { symbol: '3690.HK', name: 'Meituan' },
            { symbol: '1810.HK', name: 'Xiaomi' },
            { symbol: '9618.HK', name: 'JD.com' },
            { symbol: '0388.HK', name: 'HKEX' },
            { symbol: '1398.HK', name: 'ICBC' },
            { symbol: '0939.HK', name: 'CCB' },
            { symbol: '3988.HK', name: 'Bank of China' },
            { symbol: '0001.HK', name: 'CK Hutchison' },
            { symbol: '0016.HK', name: 'SHK Prop' },
            { symbol: '2388.HK', name: 'BOC Hong Kong' },
            { symbol: '0883.HK', name: 'CNOOC' },
            { symbol: '0267.HK', name: 'CITIC' }
        ];

        function buildTickerHTML(quotes) {
            let html = '';
            quotes.forEach(q => {
                const price = q.price !== null
                    ? Number(q.price).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                    : '--';
                const chg = q.changePercent;
                const chgStr = (chg !== null && chg !== undefined)
                    ? (chg >= 0 ? '+' : '') + Number(chg).toFixed(2) + '%'
                    : '--';
                const cls = (chg !== null && chg !== undefined)
                    ? (chg >= 0 ? 'up' : 'down')
                    : '';

                html += `<span class="item">
                    <span class="code">${q.code}</span>
                    <span class="name">${q.name}</span>
                    <span>${price}</span>
                    <span class="${cls}">${chgStr}</span>
                </span>`;
            });
            return html + html;
        }

        function renderTicker(quotes) {
            document.getElementById('ticker-content').innerHTML = buildTickerHTML(quotes);
        }

        renderTicker(HK_STOCKS.map(s => ({
            code: s.symbol.replace('.HK', ''),
            name: s.name,
            price: null,
            changePercent: null
        })));

        async function fetchHKStocks() {
            const symbols = HK_STOCKS.map(s => s.symbol).join(',');
            const yahooUrl = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=' + symbols;

            let results = null;

            try {
                const r = await fetch(yahooUrl);
                if (r.ok) {
                    const data = await r.json();
                    if (data.quoteResponse && data.quoteResponse.result) {
                        results = data.quoteResponse.result;
                    }
                }
            } catch (e) {}

            if (!results) {
                try {
                    const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(yahooUrl));
                    if (r.ok) {
                        const data = await r.json();
                        if (data.quoteResponse && data.quoteResponse.result) {
                            results = data.quoteResponse.result;
                        }
                    }
                } catch (e) {}
            }

            if (!results) {
                try {
                    const r = await fetch('https://corsproxy.io/?' + encodeURIComponent(yahooUrl));
                    if (r.ok) {
                        const data = await r.json();
                        if (data.quoteResponse && data.quoteResponse.result) {
                            results = data.quoteResponse.result;
                        }
                    }
                } catch (e) {}
            }

            if (!results) {
                console.warn('HKEX data unavailable');
                return;
            }

            const map = {};
            results.forEach(q => { map[q.symbol] = q; });

            const quotes = HK_STOCKS.map(s => {
                const q = map[s.symbol];
                return {
                    code: s.symbol.replace('.HK', ''),
                    name: s.name,
                    price: q ? q.regularMarketPrice : null,
                    changePercent: q ? q.regularMarketChangePercent : null
                };
            });

            renderTicker(quotes);
        }

        fetchHKStocks();
        setInterval(fetchHKStocks, 60000);

        // ===== PROMO ROTATION =====
        const mainArea = document.getElementById('main-area');
        const PROMO_DURATION = 45000;
        const CYCLE_INTERVAL = 120000;

        function showPromo() {
            mainArea.classList.add('promo-mode');
            setTimeout(() => mainArea.classList.remove('promo-mode'), PROMO_DURATION);
        }

        setTimeout(() => {
            showPromo();
            setInterval(showPromo, CYCLE_INTERVAL);
        }, CYCLE_INTERVAL);

        // ===== HLS =====
        function loadStream(id, url) {
            const elem = document.getElementById(id);
            if (!elem) return;
            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    manifestLoadingTimeOut: 15000,
                    levelLoadingTimeOut: 15000
                });
                hls.loadSource(url);
                hls.attachMedia(elem);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    elem.muted = true;
                    elem.play().catch(() => {});
                });
            } else if (elem.canPlayType('application/vnd.apple.mpegurl')) {
                elem.src = url;
                elem.muted = true;
                elem.play().catch(() => {});
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStream('tv-1', 'https://e7c8f7d5.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWdiX1JlZEJ1bGxUVi0xX0hMUw/playlist.m3u8');
            loadStream('tv-2', 'https://a62dad94.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWV1X0ZJRkFQbHVzRW5nbGlzaF9ITFM/playlist.m3u8');
            loadStream('tv-3', 'https://rthktv32-live.akamaized.net/hls/live/2036819/RTHKTV32/master.m3u8');
            loadStream('tv-4', 'https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/master.m3u8');
        });
    </script>
</body>
</html>
