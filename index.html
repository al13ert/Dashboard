<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>VINO Personal Training - Command Center</title>
    <!-- HLS.js Library for Broadcast Live Streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --vino-red: #8a0625;
            --vino-dark: #0a0a0c;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--vino-dark);
            color: #ffffff;
        }

        /* DASHBOARD GRID CONTAINER (1920x1080) */
        .dashboard {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-columns: 100vw;
            grid-template-rows: 80px calc(100vh - 125px) 45px;
            background-color: #000;
        }

        /* TIER 1: WHITE HEADER BANNER FOR MAXIMUM LOGO CONTRAST */
        .header-bar {
            grid-row: 1;
            background: #ffffff;
            border-bottom: 4px solid var(--vino-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 58px;
            max-width: 250px;
            object-fit: contain;
            display: block;
        }

        .logo-text-fallback {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #000000;
            font-style: italic;
        }

        .logo-text-fallback span {
            color: var(--vino-red);
        }

        .header-widgets {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .widget-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f0f0f4;
            color: #111111;
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid #dddddd;
        }

        #weather-box { color: #0066cc; }
        #date-box { color: #222222; }

        #clock-box {
            background: var(--vino-red);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            letter-spacing: 1px;
            border: none;
        }

        /* TIER 2: MAIN 5-SCREEN BODY WITH VINO RED BORDERS */
        .main-display-body {
            grid-row: 2;
            display: grid;
            grid-template-rows: 58% 42%;
            width: 100%;
            height: 100%;
            gap: 8px;
            padding: 8px;
            background-color: #000;
        }

        /* TOP HALF: 2 BIG SCREENS */
        .top-row-grid {
            display: grid;
            grid-template-columns: 50% 50%;
            width: 100%;
            height: 100%;
            gap: 8px;
        }

        /* BOTTOM HALF: 3 SMALLER SCREENS */
        .bottom-row-grid {
            display: grid;
            grid-template-columns: calc(33.33% - 5.33px) calc(33.33% - 5.33px) calc(33.34% - 5.33px);
            width: 100%;
            height: 100%;
            gap: 8px;
        }

        /* VIDEO & PROMO CONTAINER BOXES WITH VINO RED BORDER FRAME */
        .video-box {
            position: relative;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--vino-red);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(138, 6, 37, 0.4);
        }

        .video-box video, .video-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
            background: #000;
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(10, 10, 12, 0.9);
            color: #ffffff;
            padding: 4px 10px;
            border-left: 4px solid var(--vino-red);
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 3px;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* TIER 3: ANNOUNCEMENT TICKER FOOTER */
        .ticker-zone {
            grid-row: 3;
            background: #0d0d12;
            border-top: 2px solid var(--vino-red);
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-label {
            background: var(--vino-red);
            color: #fff;
            padding: 0 25px;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 10;
        }

        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 30s linear infinite;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- TIER 1: WHITE HEADER BANNER -->
        <div class="header-bar">
            
            <div class="logo-container">
                <img src="vino_logo.png" alt="VINO Personal Training" class="logo-img" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
                <div id="fallback-logo" class="logo-text-fallback" style="display:none;">V<span>I</span>NO</div>
            </div>

            <div class="header-widgets">
                <div class="widget-item" id="date-box">
                    <span>📅</span>
                    <span id="live-date">---, -- ---</span>
                </div>
                <div class="widget-item" id="weather-box">
                    <span id="weather-icon">☀️</span>
                    <span id="weather-temp">--°C</span>
                    <span style="font-size: 0.8rem; color:#666;">HK</span>
                </div>
                <div class="widget-item" id="clock-box">00:00:00</div>
            </div>

        </div>

        <!-- TIER 2: MAIN DISPLAY GRID -->
        <div class="main-display-body">
            
            <!-- TOP HALF: 2 BIG SCREENS -->
            <div class="top-row-grid">
                
                <!-- TOP LEFT: AL JAZEERA ENGLISH -->
                <div class="video-box">
                    <div class="video-label">Al Jazeera English Live</div>
                    <video id="stream-aljazeera" autoplay muted playsinline></video>
                </div>

                <!-- TOP RIGHT: DW NEWS WORLD -->
                <div class="video-box">
                    <div class="video-label">DW World News</div>
                    <video id="stream-dw" autoplay muted playsinline></video>
                </div>

            </div>

            <!-- BOTTOM HALF: 3 SMALLER SCREENS -->
            <div class="bottom-row-grid">
                
                <!-- BOTTOM LEFT: REDBULL TV -->
                <div class="video-box">
                    <div class="video-label">RedBull TV • Action Sports</div>
                    <video id="stream-redbull" autoplay muted playsinline></video>
                </div>

                <!-- BOTTOM CENTER: VINO PROTEIN SHAKE PROMO -->
                <div class="video-box">
                    <div class="video-label" style="border-left-color: #ffab00;">VINO Bar Feature</div>
                    <img src="promo.jpg" alt="VINO House-Made Coffee Protein Shake">
                </div>

                <!-- BOTTOM RIGHT: FRANCE 24 ENGLISH -->
                <div class="video-box">
                    <div class="video-label">France 24 Live</div>
                    <video id="stream-france24" autoplay muted playsinline></video>
                </div>

            </div>

        </div>

        <!-- TIER 3: ANNOUNCEMENT TICKER FOOTER -->
        <div class="ticker-zone">
            <div class="ticker-label">VINO SPECIAL</div>
            <div class="ticker-text">
                ☕ NEW! HOUSE-MADE COFFEE PROTEIN SHAKE • LARGE HK$45 | SMALL HK$42 • AVAILABLE NOW AT THE VINO BAR • CONSISTENCY DRIVES RESULTS ☕
            </div>
        </div>

    </div>

    <script>
        // 1. LIVE CLOCK AND DATE UPDATER
        function updateClockAndDate() {
            var now = new Date();
            document.getElementById('clock-box').innerText = now.toLocaleTimeString();
            var options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            document.getElementById('live-date').innerText = now.toLocaleDateString('en-GB', options);
        }
        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();

        // 2. LIVE HK OBSERVATORY WEATHER API
        function fetchWeather() {
            fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en')
                .then(response => response.json())
                .then(data => {
                    var temp = data.temperature.data[0].value;
                    document.getElementById('weather-temp').innerText = temp + "°C";
                })
                .catch(err => { console.log("Weather error:", err); });
        }
        fetchWeather();
        setInterval(fetchWeather, 600000);

        // 3. INITIALIZE STABLE HLS BROADCAST STREAMS WITH RETRY LOGIC
        window.addEventListener('DOMContentLoaded', function() {
            var streams = [
                // Stream 1: Al Jazeera English Live
                { id: 'stream-aljazeera', url: 'https://live-hls-web-aje.getaj.net/AJE/03.m3u8' },
                // Stream 2: DW News World Broadcast
                { id: 'stream-dw', url: 'https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8' },
                // Stream 3: RedBull TV Action Sports
                { id: 'stream-redbull', url: 'https://rbmn-live.akamaized.net/hls/live/591070/GEO_GLOBAL/master.m3u8' },
                // Stream 4: France 24 English
                { id: 'stream-france24', url: 'https://static.france24.com/live/F24_EN_LO_HLS/live_tv.m3u8' }
            ];

            streams.forEach(function(s) {
                var elem = document.getElementById(s.id);
                if (elem && Hls.isSupported()) {
                    var hls = new Hls({
                        manifestLoadingTimeOut: 15000,
                        manifestLoadingMaxRetry: 5,
                        levelLoadingTimeOut: 15000,
                        levelLoadingMaxRetry: 5
                    });
                    hls.loadSource(s.url);
                    hls.attachMedia(elem);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        elem.muted = true;
                        elem.play().catch(function(e) { console.log("Autoplay block on " + s.id, e); });
                    });
                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    hls.destroy();
                                    break;
                            }
                        }
                    });
                } else if (elem && elem.canPlayType('application/vnd.apple.mpegurl')) {
                    elem.src = s.url;
                    elem.muted = true;
                    elem.play();
                }
            });
        });
    </script>

</body>
</html>
